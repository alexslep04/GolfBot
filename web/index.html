<!doctype html>
<html lang="en" class="booting">
  <head>
    <meta charset="utf-8" />
    <base href="__GOLF_BASE__" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c4efab" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Golf</title>
    <link rel="icon" type="image/png" href="static/assets/icon.png" />
    <!-- The Home Screen icon comes from the manifest, not an apple-touch-icon: iOS darkens
         an apple-touch-icon in Dark mode (a black background), and leaves a manifest's alone. -->
    <link rel="manifest" href="static/manifest.webmanifest" />
    <script>
      // The saved theme, set before anything is painted (ui.js keeps it in step).
      try {
        const theme = JSON.parse(localStorage.getItem("golf-prefs") || "{}").theme;
        if (theme && theme !== "golf") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="static/style.css" />
    <link rel="preload" as="font" type="font/woff2" href="static/fonts/seurat-pro-b.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="static/fonts/sf-pro-rounded-bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="static/fonts/sf-pro-rounded-bold-rough-20.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="static/fonts/sf-pro-rounded-bold-rough-40.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="static/fonts/seurat-pro-b-rough-14.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="static/fonts/seurat-pro-b-rough-56.woff2" crossorigin />
    <link rel="preload" as="image" href="static/assets/fairway.svg" />
    <script src="static/icons.js" defer></script>
    <script src="static/ui.js" defer></script>
    <script src="static/motion.js" defer></script>
    <script src="static/board.js" defer></script>
    <script src="static/gamepad.js" defer></script>
    <script src="static/tournament.js" defer></script>
    <script src="static/tabs.js" defer></script>
    <script src="static/app.js" defer></script>
  </head>
  <body>
    <!-- (The stickers' rough paper edge, once an SVG filter here, is baked into the icons
         and fonts by tools/design/roughen.py.) -->
    <div id="backdrop" aria-hidden="true"></div>
    <main id="app" aria-live="polite">
      <div class="loading boot">Shuffling the table…</div>
    </main>
    <div id="queue-banner" class="queue-banner" hidden></div>
    <div id="invite-banner" class="invite-banner" hidden></div>
    <div id="flag-banner" class="invite-banner flag-banner" hidden></div>
    <div id="sheet" class="sheet-shade" hidden></div>
    <div id="toast" role="status" class="toast" hidden></div>
    <dialog
      id="social-dialog"
      class="social-dialog"
      aria-label="Lobby invitations"
    ></dialog>
  </body>
</html>
