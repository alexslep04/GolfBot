<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="__GOLF_BASE__" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e6ffdc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Golf</title>
    <link rel="icon" type="image/png" href="static/assets/icon.png" />
    <link rel="apple-touch-icon" href="static/assets/icon.png" />
    <link rel="stylesheet" href="static/style.css" />
    <link rel="preload" as="image" href="static/assets/logo-club.svg" />
    <script src="static/icons.js" defer></script>
    <script src="static/ui.js" defer></script>
    <script src="static/motion.js" defer></script>
    <script src="static/board.js" defer></script>
    <script src="static/gamepad.js" defer></script>
    <script src="static/app.js" defer></script>
  </head>
  <body>
    <!-- Figma "texture" effect (noise size 2, radius 0.5) for vector stickers. -->
    <svg class="svg-defs" width="0" height="0" aria-hidden="true">
      <filter
        id="texture"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%"
        color-interpolation-filters="sRGB"
      >
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.5"
          numOctaves="1"
          seed="4"
          result="noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="noise"
          scale="1.6"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <div id="backdrop" aria-hidden="true"></div>
    <main id="app" aria-live="polite">
      <div class="loading">Shuffling the table…</div>
    </main>
    <div id="queue-banner" class="queue-banner" hidden></div>
    <div id="sheet" class="sheet-shade" hidden></div>
    <div id="toast" role="status" class="toast" hidden></div>
    <dialog
      id="social-dialog"
      class="social-dialog"
      aria-label="Lobby invitations"
    ></dialog>
  </body>
</html>
